[package]
name = "moderntube"
version = "0.1.0"
description = "GTK4 YouTube client built on innertube's SABR streaming"
edition = "2021"
rust-version = "1.95"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/moderntube/moderntube"
readme = "README.md"
keywords = ["youtube", "gtk4", "libadwaita", "video", "player"]
categories = ["multimedia::video", "gui"]
publish = false

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-channel = "2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "http2"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
prost = "0.13"
# `:shortcode:` -> emoji for the chat and comment composers. Ships the gemoji shortcode
# table, which YouTube's composer accepts. GTK's completion matches CLDR names (`:sob:` misses).
emojis = "0.9"
# Animated-WebP hover previews. `webp` only, default features off: libavcodec's WebP decoder
# has no animation support, and this needs no system linkage.
image = { version = "0.25", default-features = false, features = ["webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# MPRIS D-Bus service, on the app's tokio runtime.
zbus = { version = "5", default-features = false, features = ["tokio"] }
innertube = { git = "https://github.com/moderntube/innertube-rs", package = "innertube", rev = "0a51bda" }
# Account login: embedded WebKitGTK login window + secret-service keyring.
webkit6 = "0.6"
oo7 = "0.6"
gstreamer = { version = "0.25", features = ["v1_18"] }
gstreamer-app = "0.25"

[lib]
name = "moderntube"
path = "src/lib.rs"

[[bin]]
name = "moderntube"
path = "src/main.rs"

[[bin]]
name = "wsola-render"
